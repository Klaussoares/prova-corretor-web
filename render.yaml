services:
  - type: web
    name: prova-corretor-backend
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      apt-get update && apt-get install -y poppler-utils
    startCommand: gunicorn main:app
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "src"
      # A variável GEMINI_API_KEY deve ser configurada diretamente no dashboard do Render
      # para manter sua chave segura. Não a adicione aqui diretamente.


