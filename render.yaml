services:
  - type: web
    name: prova-corretor-backend
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      apt-get update && apt-get install -y poppler-utils
    startCommand: gunicorn main:app --timeout 300 --workers 1 --threads 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: prova-corretor-db   # Nome do serviço PostgreSQL criado no Render
          property: connectionString
      # GEMINI_API_KEY deve ser configurada no dashboard do Render
databases:
  - name: prova-corretor-db
    databaseName: provacorretor
    user: provacorretor_user
